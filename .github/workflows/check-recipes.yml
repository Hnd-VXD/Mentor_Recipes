name: Check recipes

on:
  pull_request:
    paths: ['recipes/**', 'categories.json', 'inspector.py', 'build_site.py']
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Look at every recipe
        run: python3 tools/check_recipes.py
      - name: The site builds
        run: python3 build_site.py
