name: Look at everything again

# When the rules get better, what is already published is looked at again with them, and what
# now has a serious finding is taken down. Nobody has to ask.
on:
  push:
    branches: [main]
    paths: ['inspector.py']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hub
  cancel-in-progress: false

jobs:
  rescan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Take down what now has a serious finding
        run: python3 tools/takedown.py --rescan | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the result
        run: |
          git config user.name "mentor-recipes-bot"
          git config user.email "mentor-recipes-bot@users.noreply.github.com"
          git add -A recipes quarantine
          python3 tools/guard.py   # refuses a change that is more than a few recipes
          if ! git diff --cached --quiet; then
            git commit -m "Automatic: looked at everything again"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
