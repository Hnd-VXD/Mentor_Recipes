# Netlify builds this site with one standard-library Python script; nothing to install.
[build]
  command = "python3 build_site.py"
  publish = "dist"

# Small functions: a Mentor posts a recipe, or reports one, or reports a problem with Mentor itself. They only pass it to GitHub,
# where the rules decide (netlify/functions/submit.js, report.js, tools/accept.py, takedown.py).
# The environment needs GITHUB_SUBMIT_TOKEN and SOURCE_SALT. Problem reports from Mentors (problem.js)
# go to a private repository instead, with their own token: GITHUB_REPORTS_TOKEN (GITHUB_REPORTS_REPO, default Mentor_Reports).
[functions]
  directory = "netlify/functions"

# The only script is our own search.js. Nothing inline can run, and nothing from a recipe is ever
# put on a page as markup, so nothing from a recipe can run in a visitor's browser.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self'; connect-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/raw/*"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Content-Disposition = "attachment"
    Cache-Control = "public, max-age=300"
